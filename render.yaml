services:
  - type: web
    name: nexify-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_ALLOWED_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
